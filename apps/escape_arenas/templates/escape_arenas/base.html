{% load static %}
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block escape_title %}Ducky Escape Arenas{% endblock %} · DuckyArena</title><link rel="stylesheet" href="{% static 'escape_arenas/css/escape.css' %}"><style>body{margin:0;background:#f5f7fb;color:#18243a;font-family:system-ui,sans-serif}.team5-return{display:flex;gap:1rem;align-items:center;justify-content:space-between;background:#142642;padding:1rem 2rem;color:white}.team5-return a{color:white;text-decoration:none;font-weight:650}.escape-shell{max-width:1200px;margin:auto;padding:1.25rem}.escape-nav{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}</style></head><body>
